[project]
name = "ollie-assistants"
version = "0.1.0"
description = "Compare an OSS and frontier personal assistant with evals, guardrails, observability, and Modal deployment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "gradio>=5.0.0",
  "httpx>=0.27.0",
  "modal>=1.0.0",
  "openai>=1.50.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "streamlit>=1.41.0",
  "transformers>=4.45.0",
  "torch>=2.4.0",
  "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[project.scripts]
ollie-api = "ollie_assistants.main:run"
ollie-gradio = "ollie_assistants.interface.gradio_app:main"
ollie-eval = "ollie_assistants.evals.cli:main"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
